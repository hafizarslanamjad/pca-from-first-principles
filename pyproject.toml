[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-from-first-principles"
version = "0.1.0"
description = "Mathematical explanations and Python implementations of PCA."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
lectures = [
    "matplotlib",
    "jupyter",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/hafizarslanamjad/pca-from-first-principles"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src", "examples", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
